<!DOCTYPE html>
<html>
<head>
    <title>Manage Priorities - TutorFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="mb-4">
            <a href="/" class="btn btn-outline-secondary btn-sm">← Back to Dashboard</a>
            <h2 class="mt-3">Hiring Priorities Management</h2>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Add/Update Priority</h5>
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Category (e.g. Maths, SEND, Early Years)</label>
                                <input type="text" name="category" class="form-control" required placeholder="Subject or Skill">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Weight (1-10)</label>
                                <input type="range" name="weight" class="form-range" min="1" max="10" step="1" oninput="this.nextElementSibling.value = this.value">
                                <output class="fw-bold">5</output>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Save Priority</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Active Weights</h5>
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th>Weight</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for p in priorities %}
                                <tr>
                                    <td><strong>{{ p.category }}</strong></td>
                                    <td>
                                        <div class="progress" style="height: 20px;">
                                            <div class="progress-bar bg-primary" style="width: {{ p.weight * 10 }}%">{{ p.weight }}</div>
                                        </div>
                                    </td>
                                    <td>
                                        <a href="/priorities/delete/{{ p.id }}" class="btn btn-outline-danger btn-sm">Delete</a>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
